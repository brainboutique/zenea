<div class="entity-business-process">
  <div class="form-section">
    <app-edit-field
      [data]="data()!"
      field="displayName"
      type="text"
      label="Display name"
      [readOnly]="readOnly()"
      [onMutated]="onFieldMutated"
    />
    <app-edit-field
      [data]="data()!"
      field="description"
      type="richtext"
      label="Description"
      [readOnly]="readOnly()"
      [onMutated]="onFieldMutated"
      [richtextMinHeight]="'3rem'"
    />
  </div>

  <div class="process-diagram-section">
    @for (revision of [diagramRevision()]; track revision) {
      <app-process-diagram
        [data]="data()"
        [onDataMutated]="onDataMutated()"
        [readOnly]="readOnly()"
      />
    }
  </div>
</div>
